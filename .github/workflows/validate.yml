name: Validate Aven Installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-contract:
    name: ${{ matrix.os }} installer contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused installer tests
        run: python -m unittest discover -s tests -v
      - name: Parse POSIX entrypoint
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Parse PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath install.ps1 -Raw
          [void][scriptblock]::Create($source)
